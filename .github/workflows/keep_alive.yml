name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"  # Every 10 min (Render free tier spins down after 15 min inactivity)
  workflow_dispatch:        # Manual trigger via GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            "https://correlations-anomaly-detector.onrender.com/api/health" \
            && echo "Backend is awake" \
            || echo "Backend not responding (expected if container is cold-starting)"
