name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check app/ --fix --exit-non-zero-on-fix

      - name: Audit dependencies
        continue-on-error: true
        run: pip install pip-audit && pip-audit --strict

      - name: Test
        run: pytest tests/ -v --tb=short

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

  smoke-test:
    name: Live backend smoke test
    runs-on: ubuntu-latest
    # Only meaningful after a deploy to main (Render/Vercel auto-deploy from main).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deploy and ping backend health
        run: |
          URL="https://correlations-anomaly-detector.onrender.com/api/health"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 60 "$URL"; then
              echo "Backend healthy"; exit 0
            fi
            echo "Attempt $i: backend not ready yet, retrying in 30s..."; sleep 30
          done
          echo "Backend did not become healthy after deploy"; exit 1
